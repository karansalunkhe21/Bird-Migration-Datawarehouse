version: 2

models:
  - name: fact_order_fulfillment
    description: "Order-level fact table. One row per order. Does not include product but tracks order fulfillment."
    columns:
      - name: orderid
        description: "Degenerate dimension key of the order."
        tests:
          - unique
          - not_null

      - name: customerkey
        description: "Foreign key reference to dim_customer."

      - name: employeekey
        description: "Foreign key reference to dim_employee."

      - name: orderdatekey
        description: "Role-playing key for Order Date in dim_date."

      - name: requireddatekey
        description: "Role-playing key for Required Date in dim_date."

      - name: shippeddatekey
        description: "Role-playing key for Shipped Date in dim_date."

      - name: quantity
        description: "Additive fact for total quantity of products sold per order."

      - name: totalorderamount
        description: "Additive fact for total order amount (quantity * product price - discount)."

      - name: daysfromordertoshipped
        description: "Number of days elapsed from order to shipment."

      - name: daysfromordertorequired
        description: "Number of days between order date and required date."

      - name: shippedtorequireddelta
        description: "Difference between shipped and required dates (positive = late)."

      - name: shippedontime
        description: "Indicator (Yes/No) for whether the shipment was on time."