version: 2

models:
  - name: dim_product
    description: "Product dimension. One row per product."
    columns:
      - name: productkey
        description: "Surrogate key for the product."
        tests:
          - unique
          - not_null
      - name: productid
        description: "Business key / source product ID."
        tests:
          - not_null
          - unique
      - name: productname
        description: "Name of the product."
      - name: supplierid
        description: "FK to dim_supplier."
      - name: categoryid
        description: "FK to dim_category."
      - name: unitprice
        description: "Price per unit of the product."
      - name: unitsinstock
        description: "Current stock level."
      - name: discontinued
        description: "Indicator if product is discontinued."